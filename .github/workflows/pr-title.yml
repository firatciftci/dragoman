name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check for a Conventional Commits type
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! grep -qE '^(feat|fix|perf|refactor|docs|style|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ]' <<< "$TITLE"; then
            echo "::error::Start the title with a type, like \"feat: add a dark theme\" or \"fix(popup): stop the overscroll\". Allowed types: feat, fix, perf, refactor, docs, style, test, build, ci, chore, revert."
            exit 1
          fi
